name: docker

# PRs are tested once per update; main runs again after a merge (D1 publishes :edge from it).
# The image job (build, image checks, publish) is skipped until plan D1 enables publishing;
# until then the image is built and checked locally (scripts/test-image.sh).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Sync dependencies
        run: uv sync --directory backend --frozen
      - name: Lint
        run: uv run --directory backend ruff check .
      - name: Format
        run: uv run --directory backend ruff format --check .
      - name: Types
        run: uv run --directory backend ty check app
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests
        run: uv run --directory backend pytest -q
      - name: Migrations
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///$(mktemp -d)/t.db"
          uv run --directory backend alembic upgrade head
          uv run --directory backend alembic check

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Types
        run: npm --prefix frontend run typecheck
      - name: Tests
        run: npm --prefix frontend test -- --run
      - name: Build
        run: npm --prefix frontend run build

  image:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    if: vars.DOCKERHUB_PUSH_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fetcharr:dev
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image checks (tools, smoke, PUID/PGID, backups, no local files)
        run: scripts/test-image.sh fetcharr:dev
      # Publishing stays off until plan D1 sets the repository variable DOCKERHUB_PUSH_ENABLED=true.
      - name: Docker Hub login
        if: vars.DOCKERHUB_PUSH_ENABLED == 'true' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image metadata
        id: meta
        if: vars.DOCKERHUB_PUSH_ENABLED == 'true' && github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Push to Docker Hub
        if: vars.DOCKERHUB_PUSH_ENABLED == 'true' && github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
