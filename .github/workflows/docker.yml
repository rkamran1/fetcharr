name: docker

# CI tests and builds; it never publishes. The image is published from the owner's Mac with
# scripts/publish.sh (D1), so there is nothing here for a release tag or a weekly cron to do:
# both triggers, the Docker Hub login/metadata/push steps and the weekly rebuild job were
# removed. Moving publishing back into CI means restoring them together.
# PRs are tested once per update; main runs again after a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Sync dependencies
        run: uv sync --directory backend --frozen
      - name: Lint
        run: uv run --directory backend ruff check .
      - name: Format
        run: uv run --directory backend ruff format --check .
      - name: Types
        run: uv run --directory backend ty check app
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests
        run: uv run --directory backend pytest -q
      - name: Migrations
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///$(mktemp -d)/t.db"
          uv run --directory backend alembic upgrade head
          uv run --directory backend alembic check

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Types
        run: npm --prefix frontend run typecheck
      - name: Tests
        run: npm --prefix frontend test -- --run
      - name: Build
        run: npm --prefix frontend run build

  image:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fetcharr:dev
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image checks (tools, smoke, PUID/PGID, backups, no local files)
        run: scripts/test-image.sh fetcharr:dev
